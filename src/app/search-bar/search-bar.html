<div class="search-box">

  <div class="form-group d-flex flex-wrap gap-2 mb-3">
    <input type="text"
           class="form-control"
           placeholder="Brand"
           [(ngModel)]="brand"
           (input)="searchAutoList()">

    <input type="text"
           class="form-control"
           placeholder="Model"
           [(ngModel)]="model"
           (input)="searchAutoList()">

    <input type="number"
           class="form-control"
           placeholder="Min Price"
           [(ngModel)]="minPrice"
           (input)="searchAutoList()">

    <input type="number"
           class="form-control"
           placeholder="Max Price"
           [(ngModel)]="maxPrice"
           (input)="searchAutoList()">

    <button class="btn btn-primary" (click)="searchAutoList()">
      Search
    </button>
  </div>

  <div class="car-list d-flex flex-wrap gap-3">
    <div class="card" *ngFor="let auto of filteredAutos" style="width: 18rem;">
      <img [src]="'/images/' + auto.photo" class="card-img-top" alt="{{auto.model}}">
      <div class="card-body">
        <h5>{{ auto.brand }} - {{ auto.model }}</h5>
        <p>{{ auto.price }} TND / day</p>
        <button class="btn btn-success" (click)="selectedAuto(auto)">
          View
        </button>
      </div>
    </div>
  </div>

</div>
