<app-head-bar></app-head-bar>

<app-search-bar
  [autos]="autoList"
  (selectAutoEvent)="updateAuto($event)">
</app-search-bar>

<div *ngIf="selectedAuto" class="details">
  <h2>Car details</h2>

  <img
    [src]="'assets/images/' + selectedAuto.photo"
    alt="{{ selectedAuto.model }}"
    class="car-image"
  />

  <p><strong>Brand:</strong> {{ selectedAuto.brand }}</p>
  <p><strong>Model:</strong> {{ selectedAuto.model }}</p>
  <p><strong>Price:</strong> {{ selectedAuto.price }} TND</p>
  <p><strong>Power:</strong> {{ selectedAuto.power }} CV</p>
  <p><strong>Available:</strong> {{ selectedAuto.availability }}</p>
  <p><strong>Description:</strong> {{ selectedAuto.description }}</p>
</div>
